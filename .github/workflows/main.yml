name: Build iOS Mod Menu

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Tweak
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (ldid)
        run: brew install ldid

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build with Theos
        run: |
          MAKEFILE_PATH=$(find . -iname "makefile" | head -n 1)
          
          if [ -z "$MAKEFILE_PATH" ]; then
            echo "Error: Makefile එක සොයා ගැනීමට නොහැකි විය!"
            exit 1
          fi
          
          cd "$(dirname "$MAKEFILE_PATH")"
          
          # Clean old builds and compile with all bypass flags
          make clean
          make package FINALPACKAGE=1 \
            ADDITIONAL_CFLAGS="-Wno-error -Wno-deprecated-declarations -Wno-missing-template-arg-list-after-template-kw -Wno-module-import-in-extern-c" \
            ADDITIONAL_CCFLAGS="-Wno-error -Wno-deprecated-declarations -Wno-missing-template-arg-list-after-template-kw -Wno-module-import-in-extern-c"
          
          echo "--- Dylib ෆයිල් එක වෙනම ලබා ගැනීම ---"
          mkdir -p Final_Output
          find .theos/obj -name "*.dylib" -exec cp {} ./Final_Output/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-Dylib
          path: Final_Output/*.dylib
