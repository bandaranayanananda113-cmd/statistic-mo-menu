name: Build 34306jit Mod Menu

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos Environment
        run: |
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git $GITHUB_WORKSPACE/theos

      - name: Setup iOS SDKs
        run: |
          rm -rf $GITHUB_WORKSPACE/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $GITHUB_WORKSPACE/theos/sdks

      - name: Build Tweak Package
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Upload Built Deb Package
        uses: actions/upload-artifact@v4
        with:
          name: 34306jit-deb
          path: packages/*.deb

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 34306jit-dylib
          path: .theos/obj/debug/*.dylib
