name: Build iOS Mod Menu

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Tweak
    runs-on: macos-13

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build with Theos
        run: |
          MAKEFILE_PATH=$(find . -iname "makefile" | head -n 1)
          
          if [ -z "$MAKEFILE_PATH" ]; then
            echo "Error: Makefile not found!"
            exit 1
          fi
          
          cd "$(dirname "$MAKEFILE_PATH")"
          
          echo -e "\nADDITIONAL_CFLAGS += -Wno-error -Wno-nontrivial-memcall -Wno-module-import-in-extern-c" >> Makefile
          echo -e "ADDITIONAL_CCFLAGS += -Wno-error -Wno-nontrivial-memcall -Wno-module-import-in-extern-c\n" >> Makefile
          
          make clean
          make FINALPACKAGE=1
          
          mkdir -p Final_Output
          find .obj -name "*.dylib" -exec cp {} ./Final_Output/ \; || find . -name "*.dylib" -exec cp {} ./Final_Output/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-Dylib
          path: "**/Final_Output/*.dylib"
