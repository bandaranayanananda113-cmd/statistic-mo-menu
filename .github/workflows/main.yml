name: Build iOS Mod Menu

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Tweak
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build with Theos
        run: |
          # 1. Makefile එක පිහිටා ඇති ස්ථානය සෙවීම
          MAKEFILE_PATH=$(find . -iname "Makefile" | head -n 1)
          
          if [ -z "$MAKEFILE_PATH" ]; then
            echo "Error: Makefile එක සොයා ගැනීමට නොහැකි විය!"
            exit 1
          fi
          
          CD_DIR=$(dirname "$MAKEFILE_PATH")
          cd "$CD_DIR"
          
          # 2. Makefile එකට අවශ්‍ය Warning Flags ආරක්ෂිතව එකතු කිරීම
          echo "" >> Makefile
          echo "ADDITIONAL_CFLAGS += -Wno-error -Wno-nontrivial-memcall -Wno-module-import-in-extern-c" >> Makefile
          echo "ADDITIONAL_CCFLAGS += -Wno-error -Wno-nontrivial-memcall -Wno-module-import-in-extern-c" >> Makefile
          
          # 3. Compile කිරීම
          make clean
          make FINALPACKAGE=1
          
          # 4. නිර්මාණය වූ .dylib ෆයිල් එක සොයා වෙනම Folder එකකට දැමීම
          mkdir -p Final_Output
          find . -name "*.dylib" -exec cp {} ./Final_Output/ \;

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-Dylib
          path: "**/Final_Output/*.dylib"
